[project]
name = "workmate-ai"
version = "0.1.0"
description = "Claude-style AI workspace for working with files in a sandboxed Docker container."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "langchain>=1.3.4",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.4",
    "langsmith>=0.10.5",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "redis>=8.0.1",
    "streamlit>=1.42.0",
    "uvicorn>=0.49.0",
]
